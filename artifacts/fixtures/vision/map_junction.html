<!doctype html><html><head><meta charset=utf-8><title>Metro Transit Map</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}svg{display:block;border:1px solid #cbd5e1;background:white;border-radius:8px}.region{cursor:pointer}</style></head><body><h1>Metro Transit Map</h1><svg width="400" height="300"><line x1="40" y1="130" x2="360" y2="130" stroke="#ef4444" stroke-width="6"/><line x1="200" y1="30" x2="200" y2="230" stroke="#3b82f6" stroke-width="6"/><circle cx="80" cy="130" r="12" class=region onclick="select('Red West')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><circle cx="320" cy="130" r="12" class=region onclick="select('Red East')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><circle cx="200" cy="60" r="12" class=region onclick="select('Blue North')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><circle cx="200" cy="200" r="12" class=region onclick="select('Blue South')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><circle cx="200" cy="130" r="16" class=region onclick="select('Central Junction')" fill="white" stroke="#111827" stroke-width="5"/></svg><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}</script></body></html>
