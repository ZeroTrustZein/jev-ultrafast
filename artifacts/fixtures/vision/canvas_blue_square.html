<!doctype html><html><head><meta charset=utf-8><title>Canvas Selection</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}canvas{border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:crosshair}</style></head><body><h1>Canvas Selection</h1><canvas id=c width=400 height=280></canvas><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const c=document.getElementById('c'),ctx=c.getContext('2d'),shapes=[{name:"Orange Square",hit:(px,py)=>px>=55&&px<=125&&py>=45&&py<=115},{name:"Purple Circle",hit:(x,y)=>Math.hypot(x-280,y-80)<=34},{name:"Blue Square",hit:(px,py)=>px>=55&&px<=125&&py>=170&&py<=240},{name:"Green Circle",hit:(x,y)=>Math.hypot(x-280,y-205)<=34}];ctx.fillStyle='#f97316';ctx.fillRect(55,45,70,70);ctx.beginPath();ctx.arc(280,80,34,0,Math.PI*2);ctx.fillStyle='#a855f7';ctx.fill();ctx.fillStyle='#2563eb';ctx.fillRect(55,170,70,70);ctx.beginPath();ctx.arc(280,205,34,0,Math.PI*2);ctx.fillStyle='#10b981';ctx.fill();
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const s of shapes)if(s.hit(x,y)){select(s.name);return}});</script></body></html>
