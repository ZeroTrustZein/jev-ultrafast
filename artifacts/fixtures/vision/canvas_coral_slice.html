<!doctype html><html><head><meta charset=utf-8><title>Canvas Selection</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}canvas{border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:crosshair}</style></head><body><h1>Canvas Selection</h1><canvas id=c width=400 height=280></canvas><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const c=document.getElementById('c'),ctx=c.getContext('2d'),shapes=[{name:"Navy Slice",hit:(x,y)=>{let a=Math.atan2(y-140,x-200);if(a<0)a+=Math.PI*2;return Math.hypot(x-200,y-140)<100&&a>=0.0&&a<1.5707963267948966;}},{name:"Coral Slice",hit:(x,y)=>{let a=Math.atan2(y-140,x-200);if(a<0)a+=Math.PI*2;return Math.hypot(x-200,y-140)<100&&a>=1.5707963267948966&&a<3.141592653589793;}},{name:"Teal Slice",hit:(x,y)=>{let a=Math.atan2(y-140,x-200);if(a<0)a+=Math.PI*2;return Math.hypot(x-200,y-140)<100&&a>=3.141592653589793&&a<4.71238898038469;}},{name:"Gold Slice",hit:(x,y)=>{let a=Math.atan2(y-140,x-200);if(a<0)a+=Math.PI*2;return Math.hypot(x-200,y-140)<100&&a>=4.71238898038469&&a<6.283185307179586;}}];ctx.beginPath();ctx.moveTo(200,140);ctx.arc(200,140,100,-1.5707963267948966,0.0);ctx.closePath();ctx.fillStyle='#1e3a8a';ctx.fill();ctx.beginPath();ctx.moveTo(200,140);ctx.arc(200,140,100,0,1.5707963267948966);ctx.closePath();ctx.fillStyle='#f97316';ctx.fill();ctx.beginPath();ctx.moveTo(200,140);ctx.arc(200,140,100,1.5707963267948966,3.141592653589793);ctx.closePath();ctx.fillStyle='#0d9488';ctx.fill();ctx.beginPath();ctx.moveTo(200,140);ctx.arc(200,140,100,3.141592653589793,4.71238898038469);ctx.closePath();ctx.fillStyle='#eab308';ctx.fill();
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const s of shapes)if(s.hit(x,y)){select(s.name);return}});</script></body></html>
