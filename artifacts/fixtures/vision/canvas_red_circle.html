<!doctype html><html><head><meta charset=utf-8><title>Canvas Selection</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}canvas{border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:crosshair}</style></head><body><h1>Canvas Selection</h1><canvas id=c width=400 height=280></canvas><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const c=document.getElementById('c'),ctx=c.getContext('2d'),shapes=[{name:"Blue Circle",hit:(x,y)=>Math.hypot(x-90,y-80)<=34},{name:"Green Circle",hit:(x,y)=>Math.hypot(x-280,y-80)<=34},{name:"Red Circle",hit:(x,y)=>Math.hypot(x-90,y-205)<=34},{name:"Yellow Circle",hit:(x,y)=>Math.hypot(x-280,y-205)<=34}];ctx.beginPath();ctx.arc(90,80,34,0,Math.PI*2);ctx.fillStyle='#3b82f6';ctx.fill();ctx.beginPath();ctx.arc(280,80,34,0,Math.PI*2);ctx.fillStyle='#22c55e';ctx.fill();ctx.beginPath();ctx.arc(90,205,34,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();ctx.beginPath();ctx.arc(280,205,34,0,Math.PI*2);ctx.fillStyle='#eab308';ctx.fill();
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const s of shapes)if(s.hit(x,y)){select(s.name);return}});</script></body></html>
