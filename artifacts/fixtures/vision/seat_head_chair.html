<!doctype html><html><head><meta charset=utf-8><title>Conference Room Layout</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}.grid{display:flex;flex-direction:column;gap:9px;background:white;padding:16px;border:1px solid #cbd5e1;width:max-content}.row{display:flex;gap:9px}.cell{width:42px;height:42px;border:1px solid #94a3b8;border-radius:6px;cursor:pointer}.occupied{background:#64748b}.free{background:#22c55e}.access{background:#3b82f6}.aisle{margin-right:24px}</style></head><body><h1>Conference Room Layout</h1><div class=grid><div class=row><button class='cell occupied' onclick="select('Chair T1')"></button><button class='cell occupied' onclick="select('Chair T2')"></button></div><div class=row><button class='cell free' onclick="select('Chair H1')"></button><button class='cell occupied' onclick="select('Chair F1')"></button></div><div class=row><button class='cell occupied' onclick="select('Chair B1')"></button><button class='cell occupied' onclick="select('Chair B2')"></button></div></div><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}</script></body></html>
