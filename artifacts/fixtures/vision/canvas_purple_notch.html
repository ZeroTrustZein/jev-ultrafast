<!doctype html><html><head><meta charset=utf-8><title>Canvas Selection</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}canvas{border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:crosshair}</style></head><body><h1>Canvas Selection</h1><canvas id=c width=400 height=280></canvas><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const c=document.getElementById('c'),ctx=c.getContext('2d'),shapes=[{name:"Level 1",hit:(x,y)=>Math.hypot(x-75,y-140)<=17},{name:"Level 2",hit:(x,y)=>Math.hypot(x-137,y-140)<=17},{name:"Level 3",hit:(x,y)=>Math.hypot(x-199,y-140)<=17},{name:"Level 4",hit:(x,y)=>Math.hypot(x-261,y-140)<=17},{name:"Level 5",hit:(x,y)=>Math.hypot(x-323,y-140)<=17}];ctx.beginPath();ctx.arc(75,140,17,0,Math.PI*2);ctx.fillStyle='#22c55e';ctx.fill();ctx.beginPath();ctx.arc(137,140,17,0,Math.PI*2);ctx.fillStyle='#3b82f6';ctx.fill();ctx.beginPath();ctx.arc(199,140,17,0,Math.PI*2);ctx.fillStyle='#eab308';ctx.fill();ctx.beginPath();ctx.arc(261,140,17,0,Math.PI*2);ctx.fillStyle='#a855f7';ctx.fill();ctx.beginPath();ctx.arc(323,140,17,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();ctx.beginPath();ctx.moveTo(55,140);ctx.lineTo(345,140);ctx.lineWidth=6;ctx.strokeStyle='#94a3b8';ctx.stroke();ctx.beginPath();ctx.arc(75,140,17,0,Math.PI*2);ctx.fillStyle='#22c55e';ctx.fill();ctx.beginPath();ctx.arc(137,140,17,0,Math.PI*2);ctx.fillStyle='#3b82f6';ctx.fill();ctx.beginPath();ctx.arc(199,140,17,0,Math.PI*2);ctx.fillStyle='#eab308';ctx.fill();ctx.beginPath();ctx.arc(261,140,17,0,Math.PI*2);ctx.fillStyle='#a855f7';ctx.fill();ctx.beginPath();ctx.arc(323,140,17,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const s of shapes)if(s.hit(x,y)){select(s.name);return}});</script></body></html>
