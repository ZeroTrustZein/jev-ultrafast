<!doctype html><html><head><meta charset=utf-8><title>Province Boundary Map</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}svg{display:block;border:1px solid #cbd5e1;background:white;border-radius:8px}.region{cursor:pointer}</style></head><body><h1>Province Boundary Map</h1><svg width="400" height="300"><polygon points="160,20 240,20 230,90 170,90" class=region onclick="select('Northern Peninsula')" fill="#67e8f9" stroke="#475569" stroke-width="2"/><polygon points="40,100 150,100 140,250 40,230" class=region onclick="select('West Region')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><polygon points="250,100 360,100 360,230 260,250" class=region onclick="select('East Region')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><polygon points="150,170 250,170 220,280 180,280" class=region onclick="select('Southern Cape')" fill="#94a3b8" stroke="#475569" stroke-width="2"/></svg><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}</script></body></html>
