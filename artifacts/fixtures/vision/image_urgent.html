<!doctype html><html><head><meta charset=utf-8><title>Issue Priority</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}.tiles{display:flex;gap:12px;flex-wrap:wrap}.tiles button{padding:4px;border:1px solid #cbd5e1;background:white;border-radius:7px;cursor:pointer}</style></head><body><h1>Issue Priority</h1><div class=tiles><button onclick="select('Low')"><canvas id=c0 width=126 height=60></canvas></button><button onclick="select('Medium')"><canvas id=c1 width=126 height=60></canvas></button><button onclick="select('High')"><canvas id=c2 width=126 height=60></canvas></button><button onclick="select('Urgent')"><canvas id=c3 width=126 height=60></canvas></button></div><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const words=["Low", "Medium", "High", "Urgent"];words.forEach((w,i)=>{let c=document.getElementById("c"+i),x=c.getContext("2d");x.fillStyle="#e2e8f0";x.fillRect(0,0,126,60);x.fillStyle="#172033";x.font="bold 16px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(w,63,30)});</script></body></html>
