<!doctype html><html><head><meta charset=utf-8><title>Archipelago Map</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}svg{display:block;border:1px solid #cbd5e1;background:white;border-radius:8px}.region{cursor:pointer}</style></head><body><h1>Archipelago Map</h1><svg width="400" height="300"><polygon points="25,25 210,30 200,135 35,135" class=region onclick="select('Mainland North')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><polygon points="35,150 190,155 175,250 45,240" class=region onclick="select('Mainland South')" fill="#94a3b8" stroke="#475569" stroke-width="2"/><polygon points="270,175 365,180 350,250 260,240" class=region onclick="select('Southeast Island')" fill="#fde047" stroke="#475569" stroke-width="2"/></svg><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}</script></body></html>
