<!doctype html><html><head><meta charset=utf-8><title>Canvas Selection</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}canvas{border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:crosshair}</style></head><body><h1>Canvas Selection</h1><canvas id=c width=400 height=280></canvas><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const c=document.getElementById('c'),ctx=c.getContext('2d'),shapes=[{name:"Red Circle",hit:(x,y)=>Math.hypot(x-80,y-140)<=34},{name:"Blue Square",hit:(px,py)=>px>=170&&px<=240&&py>=100&&py<=170},{name:"Green Triangle",hit:(px,py)=>px>=310&&px<=390&&py>=100&&py<=180}];ctx.beginPath();ctx.arc(80,140,34,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();ctx.fillStyle='#3b82f6';ctx.fillRect(170,100,70,70);ctx.beginPath();ctx.moveTo(310,180);ctx.lineTo(350,100);ctx.lineTo(390,180);ctx.closePath();ctx.fillStyle='#22c55e';ctx.fill();
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const s of shapes)if(s.hit(x,y)){select(s.name);return}});</script></body></html>
