<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Global Visa & Permit Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.5; color: #222; }
    h1 { font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 12px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="email"], select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #0066cc; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 15px; }
    button:hover { background: #0052a3; }
    .card { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
    #status { margin-top: 20px; padding: 16px; background: #e6f4ea; color: #137333; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h1>Electronic Visa Application</h1>
  <form id="visa-form" onsubmit="event.preventDefault(); submitForm();">
    <div class="card">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" aria-label="Full Name" placeholder="e.g. John Doe">
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" aria-label="Email Address" placeholder="e.g. john@example.com">
      </div>
      <div class="field">
        <label for="category">Visa Category</label>
        <select id="category" name="category" aria-label="Visa Category">
          <option value="">Select a category</option>
          <option value="tourist">Tourist Visa</option>
          <option value="business">Business Visa</option>
          <option value="student">Student Visa</option>
        </select>
      </div>
      <div class="field">
        <label for="passport_file">Passport or ID Document</label>
        <input type="file" id="passport_file" name="passport_file" aria-label="Passport Document">
      </div>
      <!-- Shadow DOM component for Address -->
      <div id="address-container"></div>
    </div>

    <!-- Iframe for declarations -->
    <iframe id="decl-frame" style="width: 100%; height: 70px; border: none;" srcdoc="
      <html><body style='margin:0; font-family:system-ui; font-size:13px; color:#555;'>
        <label style='display:flex; align-items:center; gap:8px; cursor:pointer;'>
          <input type='checkbox' id='agree' aria-label='Confirm information is accurate'>
          I confirm that all provided details and documents are accurate and complete.
        </label>
      </body></html>
    "></iframe>

    <div style="margin-top: 15px;">
      <button type="submit" id="submit-btn" aria-label="Submit Application">Submit Application</button>
    </div>
  </form>

  <div id="status"></div>

  <script>
    // Initialize Shadow DOM address component
    const host = document.getElementById('address-container');
    const shadow = host.attachShadow({mode: 'open'});
    shadow.innerHTML = `
      <style>
        .field { margin-top: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-family: system-ui; font-size: 14px; }
        input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: system-ui; }
      </style>
      <div class="field">
        <label for="street">Residential Street Address</label>
        <input type="text" id="street" aria-label="Residential Street Address" placeholder="e.g. 123 Main St, Apt 4B">
      </div>
    `;

    function submitForm() {
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const cat = document.getElementById('category').value;
      const file = document.getElementById('passport_file').files[0];
      const fileName = file ? file.name : 'None';
      const street = shadow.getElementById('street').value;

      const status = document.getElementById('status');
      status.style.display = 'block';
      status.innerHTML = `<strong>Application Submitted!</strong><br>Applicant: ${name}<br>Email: ${email}<br>Category: ${cat}<br>Document: ${fileName}<br>Address: ${street}`;
    }
  </script>
</body>
</html>
