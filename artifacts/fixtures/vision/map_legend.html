<!doctype html><html><head><meta charset=utf-8><title>Zoning District Map</title><style>
body{font:16px Arial,sans-serif;margin:24px;background:#f8fafc;color:#172033}h1{font-size:19px}#result{margin-top:22px;padding:9px;background:#e2e8f0;display:inline-block;font-weight:bold}svg{display:block;border:1px solid #cbd5e1;background:white;border-radius:8px}.region{cursor:pointer}</style></head><body><h1>Zoning District Map</h1><canvas id=legend width=380 height=40></canvas><svg width="380" height="260"><rect class=region onclick="select('Residential Zone')" x="20" y="20" width="160" height="100" fill="#8b5cf6"/><rect class=region onclick="select('Commercial Zone')" x="200" y="20" width="160" height="100" fill="#06b6d4"/><rect class=region onclick="select('Park Zone')" x="20" y="140" width="160" height="100" fill="#10b981"/><rect class=region onclick="select('Logistics Zone')" x="200" y="140" width="160" height="100" fill="#f59e0b"/></svg><div id=result>None</div><script>function select(v){document.getElementById('result').textContent='Selected: '+v}const x=document.getElementById('legend').getContext('2d');x.fillStyle='#f59e0b';x.fillRect(10,10,20,20);x.fillStyle='#172033';x.font='14px Arial';x.fillText('Logistics Zone',38,25);</script></body></html>
